<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" width="360" height="520" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="360" height="520" rx="14" fill="#0d1117"/>

  <!-- connectors -->
  <g stroke="#374151" stroke-width="2">
    <line x1="180" y1="84" x2="180" y2="124"/>
    <line x1="180" y1="188" x2="180" y2="228"/>
    <line x1="180" y1="292" x2="180" y2="332"/>
    <line x1="180" y1="396" x2="180" y2="436"/>
  </g>

  <!-- step 1 -->
  <rect x="30" y="20" width="300" height="64" rx="10" fill="#111827" stroke="#374151" stroke-width="1.5">
    <animate attributeName="stroke" values="#e5e7eb;#374151;#374151" keyTimes="0;0.2;1" dur="10s" begin="0s" repeatCount="indefinite"/>
  </rect>
  <text x="52" y="58" fill="#6b7280" font-size="13" font-weight="600">01</text>
  <text x="88" y="48" fill="#e5e7eb" font-size="16" font-weight="600">Plan</text>
  <text x="88" y="68" fill="#9ca3af" font-size="12">ChatGPT · Claude</text>

  <!-- step 2 -->
  <rect x="30" y="124" width="300" height="64" rx="10" fill="#111827" stroke="#374151" stroke-width="1.5">
    <animate attributeName="stroke" values="#e5e7eb;#374151;#374151" keyTimes="0;0.2;1" dur="10s" begin="2s" repeatCount="indefinite"/>
  </rect>
  <text x="52" y="162" fill="#6b7280" font-size="13" font-weight="600">02</text>
  <text x="88" y="152" fill="#e5e7eb" font-size="16" font-weight="600">Build</text>
  <text x="88" y="172" fill="#9ca3af" font-size="12">Google AI Studio</text>

  <!-- step 3 -->
  <rect x="30" y="228" width="300" height="64" rx="10" fill="#111827" stroke="#374151" stroke-width="1.5">
    <animate attributeName="stroke" values="#e5e7eb;#374151;#374151" keyTimes="0;0.2;1" dur="10s" begin="4s" repeatCount="indefinite"/>
  </rect>
  <text x="52" y="266" fill="#6b7280" font-size="13" font-weight="600">03</text>
  <text x="88" y="256" fill="#e5e7eb" font-size="16" font-weight="600">Data</text>
  <text x="88" y="276" fill="#9ca3af" font-size="12">Supabase · Firebase</text>

  <!-- step 4 -->
  <rect x="30" y="332" width="300" height="64" rx="10" fill="#111827" stroke="#374151" stroke-width="1.5">
    <animate attributeName="stroke" values="#e5e7eb;#374151;#374151" keyTimes="0;0.2;1" dur="10s" begin="6s" repeatCount="indefinite"/>
  </rect>
  <text x="52" y="370" fill="#6b7280" font-size="13" font-weight="600">04</text>
  <text x="88" y="360" fill="#e5e7eb" font-size="16" font-weight="600">Audit</text>
  <text x="88" y="380" fill="#9ca3af" font-size="12">Test · Fix · Secure</text>

  <!-- step 5 -->
  <rect x="30" y="436" width="300" height="64" rx="10" fill="#111827" stroke="#374151" stroke-width="1.5">
    <animate attributeName="stroke" values="#e5e7eb;#374151;#374151" keyTimes="0;0.2;1" dur="10s" begin="8s" repeatCount="indefinite"/>
  </rect>
  <text x="52" y="474" fill="#6b7280" font-size="13" font-weight="600">05</text>
  <text x="88" y="464" fill="#e5e7eb" font-size="16" font-weight="600">Deploy</text>
  <text x="88" y="484" fill="#9ca3af" font-size="12">Vercel · Google Cloud</text>

  <!-- moving dot -->
  <circle r="4" cx="180" fill="#e5e7eb">
    <animate attributeName="cy" values="52;468;468" keyTimes="0;0.8;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="10s" repeatCount="indefinite"/>
  </circle>
</svg>
