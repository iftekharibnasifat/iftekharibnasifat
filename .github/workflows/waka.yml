name: WakaTime Stats

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-commits

jobs:
  waka:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.WAKATIME_API_KEY != '' }}
    steps:
      - name: Skip notice
        if: env.HAS_KEY != 'true'
        run: echo "WAKATIME_API_KEY secret is not set, skipping. See SETUP.md."

      - name: Update README with WakaTime stats
        if: env.HAS_KEY == 'true'
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOW_TITLE: false
          BLOCKS: "░▒▓█"
          TIME_RANGE: last_7_days
          SHOW_TIME: true
          LANG_COUNT: 6
          COMMIT_MESSAGE: "chore: update WakaTime stats"
