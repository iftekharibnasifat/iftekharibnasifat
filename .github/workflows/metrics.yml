name: Metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-commits

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_TOKEN: ${{ secrets.METRICS_TOKEN != '' }}
    steps:
      - name: Skip notice
        if: env.HAS_TOKEN != 'true'
        run: echo "METRICS_TOKEN secret is not set, skipping. See SETUP.md."

      - name: Overview card
        if: env.HAS_TOKEN == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics/overview.svg
          base: header, activity, community, repositories
          config_timezone: Asia/Dhaka

      - name: Achievements
        if: env.HAS_TOKEN == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics/achievements.svg
          base: ""
          config_timezone: Asia/Dhaka
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C

      - name: 3D contribution calendar
        if: env.HAS_TOKEN == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics/isocalendar.svg
          base: ""
          config_timezone: Asia/Dhaka
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Languages breakdown
        if: env.HAS_TOKEN == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics/languages.svg
          base: ""
          config_timezone: Asia/Dhaka
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage

      - name: Coding habits
        if: env.HAS_TOKEN == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics/habits.svg
          base: ""
          config_timezone: Asia/Dhaka
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: true
